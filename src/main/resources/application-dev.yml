# 本地开发配置（不含密码，密码写在 application-dev-local.yml，该文件不会提交 Git）
spring:
  config:
    import: optional:classpath:application-dev-local.yml
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/light_diary?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
  redis:
    host: ${REDIS_HOST:localhost}
    database: 0
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 3000ms

logging:
  level:
    root: info
    com.lightdiary: debug

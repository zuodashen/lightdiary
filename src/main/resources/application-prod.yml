server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/lightdiary-api}

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:mysql}:${MYSQL_PORT:3306}/light_diary?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD}
  redis:
    host: ${REDIS_HOST:redis-lightdiary}
    port: ${REDIS_PORT:6379}
    username: ${REDIS_USERNAME:}
    password: ${REDIS_PASSWORD:}
    database: ${REDIS_DATABASE:0}
    timeout: 3000ms

logging:
  file:
    path: /var/logs
  level:
    root: info
    com.lightdiary: info

jwt:
  secret: ${JWT_SECRET:lightdiary-change-me-in-production}

knife4j:
  enable: ${KNIFE4J_ENABLE:false}

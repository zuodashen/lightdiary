# 挂载到 nginx 容器 /etc/nginx/conf.d/lightdiary.conf
# 修改 server_name 为你的域名或 IP

# ========== 前台博客 ==========
server {
    listen 80;
    server_name blog.example.com;   # TODO: 改成你的域名

    root /usr/share/nginx/html/lightdiary-web;
    index index.html;

    location /api/ {
        proxy_pass http://172.17.0.1:8081/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ========== 管理后台 ==========
server {
    listen 80;
    server_name admin.example.com;   # TODO: 改成你的域名

    root /usr/share/nginx/html/lightdiary-admin;
    index index.html;

    location ~ ^/(admin|article|category|tag|page|bookmark|bookmarkCategory|navItem|socialLink|siteSetting|comment|role|menu|resource|resourceCategory)(/|$) {
        proxy_pass http://172.17.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# lightdiary 使用 host 网络（与 mysql8、redis 同为 host 模式时推荐）
# 用法: docker compose -f docker-compose.prod.host.yml --env-file .env.host up -d
#
# nginx 在 bridge 上反代后端时，proxy_pass 改为 http://172.17.0.1:8081
# 注意：宿主机 8080 通常已被 nginx 占用，lightdiary 改用 8081

services:
  lightdiary:
    image: lightdiary:1.0.0
    container_name: lightdiary
    restart: unless-stopped
    network_mode: host
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      MYSQL_HOST: 127.0.0.1
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      JWT_SECRET: ${JWT_SECRET}
      KNIFE4J_ENABLE: ${KNIFE4J_ENABLE:-false}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /mydata/lightdiary/logs:/var/logs
